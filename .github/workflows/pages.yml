name: Render and publish gallery

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAYTRACER_TOOLING: ${{ github.workspace }}/../raytracer-tools

jobs:
  build:
    name: Test and render the current commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache legacy Rust tools and verified dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.RAYTRACER_TOOLING }}
          key: raytracer-legacy-v1-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'scripts/prepare.sh') }}
      - name: Prepare the pinned toolchains
        run: ./scripts/prepare.sh
      - name: Test the renderer
        run: ./scripts/cargo.sh test --locked
      - name: Build an optimized renderer
        run: ./scripts/cargo.sh build --release --locked -j 2
      - name: Generate the gallery from this commit
        run: >-
          python3 scripts/build_site.py
          --renderer "$RAYTRACER_TOOLING/build/target/release/raytracer"
          --output _site
          --extras
      - name: Check gallery generation and failures
        run: >-
          python3 scripts/test_site.py
          --renderer "$RAYTRACER_TOOLING/build/target/release/raytracer"
      - name: Upload a downloadable gallery preview
        uses: actions/upload-artifact@v4
        with:
          name: raytracer-gallery
          path: _site/
          if-no-files-found: error
          retention-days: 14
      - name: Test animated PNG export
        run: >-
          python3 scripts/test_animation.py
          --renderer "$RAYTRACER_TOOLING/build/target/release/raytracer"
      - name: Package the GitHub Pages site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip publication if master has moved on
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_master=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [ "$current_master" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'A newer master commit exists; keeping its gallery.'
          fi
      - name: Check GitHub Pages configuration
        if: steps.current.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Deploy the rendered gallery
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
